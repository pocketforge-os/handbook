<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 463" role="img" aria-labelledby="cut-plan-title cut-plan-desc">
  <title id="cut-plan-title">Five-stick test-node chassis batch cut plan</title>
  <desc id="cut-plan-desc">Five 1000 millimetre extrusion bars. Bars one through four each yield one 360 millimetre post, one 318 millimetre depth rail, and one 306 millimetre width rail, leaving 6.4 millimetres. Bar five yields one 306 millimetre top bar for this chassis and two reserved top bars, leaving 72.4 millimetres.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #17212b; }
    .stock { fill: #f5f3e8; stroke: #17212b; stroke-width: 2; }
    .post { fill: #c95508; }
    .depth { fill: #2f6f91; }
    .width { fill: #4f8057; }
    .topbar { fill: #694b94; }
    .reserve { fill: #baa8d1; }
    .kerf { fill: #17212b; }
    .offcut { fill: #d8d8d2; }
    .piece-label { fill: white; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .reserve-label { fill: #17212b; }
    .bar-label { font-size: 17px; font-weight: 700; text-anchor: end; dominant-baseline: middle; }
    .remainder-label { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .legend { font-size: 15px; dominant-baseline: middle; }
  </style>
  <rect x="1" y="1" width="1118" height="461" rx="10" fill="#fbfaf2" stroke="#d5d8dc" stroke-width="2"/>
  <text x="105" y="28" font-size="22" font-weight="700">Current five-stick batch plan · every bar is 1000 mm</text>
  <text x="105" y="50" font-size="15">Finished lengths; each narrow black divider reserves 3.2 mm of saw kerf</text>
  <g class="stock-bar" data-stock-bar="1" data-stock-length-mm="1000">
    <text class="bar-label" x="93" y="92">Bar 1</text>
    <rect class="stock" x="105" y="72" width="900" height="40" rx="3"/>
    <rect class="post" x="105" y="72" width="324" height="40" data-part="outer_vertical_rail" data-label="POST-OL" data-disposition="use-now" data-length-mm="360"/>
    <text class="piece-label" x="267" y="88"><tspan x="267">POST-OL</tspan><tspan x="267" dy="16">360 mm</tspan></text>
    <rect class="kerf" x="429" y="72" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="depth" x="431.88" y="72" width="286.2" height="40" data-part="outer_depth_rail" data-label="DEPTH-L-L" data-disposition="use-now" data-length-mm="318"/>
    <text class="piece-label" x="574.98" y="88"><tspan x="574.98">DEPTH-L-L</tspan><tspan x="574.98" dy="16">318 mm</tspan></text>
    <rect class="kerf" x="718.08" y="72" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="width" x="720.96" y="72" width="275.4" height="40" data-part="outer_width_rail" data-label="WIDTH-O-L" data-disposition="use-now" data-length-mm="306"/>
    <text class="piece-label" x="858.66" y="88"><tspan x="858.66">WIDTH-O-L</tspan><tspan x="858.66" dy="16">306 mm</tspan></text>
    <rect class="kerf" x="996.36" y="72" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="offcut" x="999.24" y="72" width="5.76" height="40" data-kind="offcut" data-length-mm="6.4"/>
    <text class="remainder-label" x="1065" y="92">6.4 mm scrap</text>
  </g>
  <g class="stock-bar" data-stock-bar="2" data-stock-length-mm="1000">
    <text class="bar-label" x="93" y="147">Bar 2</text>
    <rect class="stock" x="105" y="127" width="900" height="40" rx="3"/>
    <rect class="post" x="105" y="127" width="324" height="40" data-part="outer_vertical_rail" data-label="POST-OR" data-disposition="use-now" data-length-mm="360"/>
    <text class="piece-label" x="267" y="143"><tspan x="267">POST-OR</tspan><tspan x="267" dy="16">360 mm</tspan></text>
    <rect class="kerf" x="429" y="127" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="depth" x="431.88" y="127" width="286.2" height="40" data-part="outer_depth_rail" data-label="DEPTH-R-L" data-disposition="use-now" data-length-mm="318"/>
    <text class="piece-label" x="574.98" y="143"><tspan x="574.98">DEPTH-R-L</tspan><tspan x="574.98" dy="16">318 mm</tspan></text>
    <rect class="kerf" x="718.08" y="127" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="width" x="720.96" y="127" width="275.4" height="40" data-part="outer_width_rail" data-label="WIDTH-O-U" data-disposition="use-now" data-length-mm="306"/>
    <text class="piece-label" x="858.66" y="143"><tspan x="858.66">WIDTH-O-U</tspan><tspan x="858.66" dy="16">306 mm</tspan></text>
    <rect class="kerf" x="996.36" y="127" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="offcut" x="999.24" y="127" width="5.76" height="40" data-kind="offcut" data-length-mm="6.4"/>
    <text class="remainder-label" x="1065" y="147">6.4 mm scrap</text>
  </g>
  <g class="stock-bar" data-stock-bar="3" data-stock-length-mm="1000">
    <text class="bar-label" x="93" y="202">Bar 3</text>
    <rect class="stock" x="105" y="182" width="900" height="40" rx="3"/>
    <rect class="post" x="105" y="182" width="324" height="40" data-part="outer_vertical_rail" data-label="POST-DL" data-disposition="use-now" data-length-mm="360"/>
    <text class="piece-label" x="267" y="198"><tspan x="267">POST-DL</tspan><tspan x="267" dy="16">360 mm</tspan></text>
    <rect class="kerf" x="429" y="182" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="depth" x="431.88" y="182" width="286.2" height="40" data-part="outer_depth_rail" data-label="DEPTH-L-U" data-disposition="use-now" data-length-mm="318"/>
    <text class="piece-label" x="574.98" y="198"><tspan x="574.98">DEPTH-L-U</tspan><tspan x="574.98" dy="16">318 mm</tspan></text>
    <rect class="kerf" x="718.08" y="182" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="width" x="720.96" y="182" width="275.4" height="40" data-part="outer_width_rail" data-label="WIDTH-D-L" data-disposition="use-now" data-length-mm="306"/>
    <text class="piece-label" x="858.66" y="198"><tspan x="858.66">WIDTH-D-L</tspan><tspan x="858.66" dy="16">306 mm</tspan></text>
    <rect class="kerf" x="996.36" y="182" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="offcut" x="999.24" y="182" width="5.76" height="40" data-kind="offcut" data-length-mm="6.4"/>
    <text class="remainder-label" x="1065" y="202">6.4 mm scrap</text>
  </g>
  <g class="stock-bar" data-stock-bar="4" data-stock-length-mm="1000">
    <text class="bar-label" x="93" y="257">Bar 4</text>
    <rect class="stock" x="105" y="237" width="900" height="40" rx="3"/>
    <rect class="post" x="105" y="237" width="324" height="40" data-part="outer_vertical_rail" data-label="POST-DR" data-disposition="use-now" data-length-mm="360"/>
    <text class="piece-label" x="267" y="253"><tspan x="267">POST-DR</tspan><tspan x="267" dy="16">360 mm</tspan></text>
    <rect class="kerf" x="429" y="237" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="depth" x="431.88" y="237" width="286.2" height="40" data-part="outer_depth_rail" data-label="DEPTH-R-U" data-disposition="use-now" data-length-mm="318"/>
    <text class="piece-label" x="574.98" y="253"><tspan x="574.98">DEPTH-R-U</tspan><tspan x="574.98" dy="16">318 mm</tspan></text>
    <rect class="kerf" x="718.08" y="237" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="width" x="720.96" y="237" width="275.4" height="40" data-part="outer_width_rail" data-label="WIDTH-D-U" data-disposition="use-now" data-length-mm="306"/>
    <text class="piece-label" x="858.66" y="253"><tspan x="858.66">WIDTH-D-U</tspan><tspan x="858.66" dy="16">306 mm</tspan></text>
    <rect class="kerf" x="996.36" y="237" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="offcut" x="999.24" y="237" width="5.76" height="40" data-kind="offcut" data-length-mm="6.4"/>
    <text class="remainder-label" x="1065" y="257">6.4 mm scrap</text>
  </g>
  <g class="stock-bar" data-stock-bar="5" data-stock-length-mm="1000">
    <text class="bar-label" x="93" y="312">Bar 5</text>
    <rect class="stock" x="105" y="292" width="900" height="40" rx="3"/>
    <rect class="topbar" x="105" y="292" width="275.4" height="40" data-part="fixture_topbar" data-label="TOPBAR" data-disposition="use-now" data-length-mm="306"/>
    <text class="piece-label" x="242.7" y="308"><tspan x="242.7">TOPBAR</tspan><tspan x="242.7" dy="16">306 mm · USE NOW</tspan></text>
    <rect class="kerf" x="380.4" y="292" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="topbar reserve" x="383.28" y="292" width="275.4" height="40" data-part="fixture_topbar" data-label="TOPBAR" data-disposition="reserve" data-length-mm="306"/>
    <text class="piece-label reserve-label" x="520.98" y="308"><tspan x="520.98">TOPBAR</tspan><tspan x="520.98" dy="16">306 mm · RESERVE</tspan></text>
    <rect class="kerf" x="658.68" y="292" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="topbar reserve" x="661.56" y="292" width="275.4" height="40" data-part="fixture_topbar" data-label="TOPBAR" data-disposition="reserve" data-length-mm="306"/>
    <text class="piece-label reserve-label" x="799.26" y="308"><tspan x="799.26">TOPBAR</tspan><tspan x="799.26" dy="16">306 mm · RESERVE</tspan></text>
    <rect class="kerf" x="936.96" y="292" width="2.88" height="40" data-kind="kerf" data-length-mm="3.2"/>
    <rect class="offcut" x="939.84" y="292" width="65.16" height="40" data-kind="offcut" data-length-mm="72.4"/>
