  <rect class="post" x="105" y="355" width="16" height="16"/>
  <text class="legend" x="128" y="363">vertical post</text>
  <rect class="depth" x="257" y="355" width="16" height="16"/>
  <text class="legend" x="280" y="363">depth rail</text>
  <rect class="width" x="409" y="355" width="16" height="16"/>
  <text class="legend" x="432" y="363">width rail</text>
  <rect class="topbar" x="561" y="355" width="16" height="16"/>
  <text class="legend" x="584" y="363">top bar · use now</text>
  <rect class="reserve" x="713" y="355" width="16" height="16"/>
  <text class="legend" x="736" y="363">top bar · reserve</text>
  <rect class="offcut" x="883" y="355" width="16" height="16"/>
  <text class="legend" x="906" y="363">scrap</text>
  <text x="105" y="397" font-size="15" font-weight="700">13 pieces build this chassis; 2 top bars are labeled for later nodes.</text>
  <text x="105" y="418" font-size="15">Already have one straight offcut at least 309.2 mm long? Use it for TOPBAR and omit Bar 5.</text>
</svg>
