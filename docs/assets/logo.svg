<!-- PocketForge header mark — open-steel forge badge (hexagon frame · anvil +
     hammer · ember). Reads on the navy Material header at ~24-28px. Shares the
     brand DNA of mission-control/assets/{org-logo,boot-logo}. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="PocketForge">
  <defs>
    <linearGradient id="pfEmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2d0"/><stop offset="45%" stop-color="#ffb142"/><stop offset="100%" stop-color="#ff5a1a"/>
    </linearGradient>
  </defs>
  <polygon points="24,3 42.18,13.5 42.18,34.5 24,45 5.82,34.5 5.82,13.5" fill="none" stroke="#a9bcd6" stroke-width="2.3" stroke-linejoin="round"/>
  <g fill="#eef2f8">
    <rect x="15" y="32" width="18" height="3.6" rx="1.1"/>
    <rect x="20.6" y="28.7" width="6.8" height="3.6"/>
    <rect x="16.6" y="24.4" width="14.8" height="4.2" rx="1.1"/>
    <polygon points="16.6,24.7 11.4,26.5 16.6,28.3"/>
  </g>
  <g transform="rotate(-19 24 24)">
    <rect x="24" y="12.2" width="12.8" height="6.2" rx="1.6" fill="#ffffff" stroke="#17364f" stroke-width="1"/>
    <rect x="28.4" y="17.6" width="3.4" height="12.4" rx="1.4" fill="#c79a63"/>
  </g>
  <g fill="url(#pfEmber)">
    <circle cx="20.4" cy="24.2" r="2.8"/><circle cx="14.2" cy="22.6" r="1"/>
    <circle cx="27.4" cy="22.9" r="1.1"/><circle cx="17.4" cy="19.9" r="0.8"/>
  </g>
</svg>
