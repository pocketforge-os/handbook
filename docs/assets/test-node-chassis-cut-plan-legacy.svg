<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
  <title id="title">Six-stick test-node chassis cut plan</title>
  <desc id="desc">Six one-metre extrusion bars divided into vertical, depth, width, gantry upright, gantry crossbar, kerf, and retained offcut segments.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #17212b; }
    .bar { fill: #f5f3e8; stroke: #17212b; stroke-width: 2; }
    .vertical { fill: #e96a0a; }
    .depth { fill: #2f6f91; }
    .width { fill: #4f8a5b; }
    .upright { fill: #d6a20d; }
    .crossbar { fill: #76539e; }
    .kerf { fill: #17212b; }
    .offcut { fill: #d8d8d2; }
    .label { font-size: 14px; font-weight: 700; fill: white; text-anchor: middle; dominant-baseline: middle; }
    .dark-label { fill: #17212b; }
    .bar-label { font-size: 16px; font-weight: 700; text-anchor: end; dominant-baseline: middle; }
    .legend { font-size: 14px; dominant-baseline: middle; }
  </style>

  <!-- An explicit paper background keeps the dark labels legible when the
       handbook itself is viewed in dark mode. -->
  <rect x="1" y="1" width="1038" height="458" rx="10"
        fill="#fbfaf2" stroke="#d5d8dc" stroke-width="2"/>

  <text x="80" y="24" font-size="18" font-weight="700">Finished lengths; 3.2 mm conservative kerf allowance follows every piece</text>

  <g transform="translate(0 38)">
    <text class="bar-label" x="68" y="20">Bar 1</text>
    <rect class="bar" x="80" y="2" width="900" height="36" rx="3"/>
    <rect class="vertical" x="80" y="2" width="324" height="36"/><text class="label" x="242" y="20">360</text>
    <rect class="kerf" x="404" y="2" width="3" height="36"/>
    <rect class="vertical" x="407" y="2" width="324" height="36"/><text class="label" x="569" y="20">360</text>
    <rect class="kerf" x="731" y="2" width="3" height="36"/>
    <rect class="upright" x="734" y="2" width="148" height="36"/><text class="label dark-label" x="808" y="20">164</text>
    <rect class="kerf" x="882" y="2" width="3" height="36"/>
    <rect class="offcut" x="885" y="2" width="95" height="36"/><text class="label dark-label" x="932" y="20">106.4</text>
  </g>

  <g transform="translate(0 96)">
    <text class="bar-label" x="68" y="20">Bar 2</text>
    <rect class="bar" x="80" y="2" width="900" height="36" rx="3"/>
    <rect class="vertical" x="80" y="2" width="324" height="36"/><text class="label" x="242" y="20">360</text>
    <rect class="kerf" x="404" y="2" width="3" height="36"/>
    <rect class="vertical" x="407" y="2" width="324" height="36"/><text class="label" x="569" y="20">360</text>
    <rect class="kerf" x="731" y="2" width="3" height="36"/>
    <rect class="upright" x="734" y="2" width="148" height="36"/><text class="label dark-label" x="808" y="20">164</text>
    <rect class="kerf" x="882" y="2" width="3" height="36"/>
    <rect class="offcut" x="885" y="2" width="95" height="36"/><text class="label dark-label" x="932" y="20">106.4</text>
  </g>

  <g transform="translate(0 154)">
    <text class="bar-label" x="68" y="20">Bar 3</text>
    <rect class="bar" x="80" y="2" width="900" height="36" rx="3"/>
    <rect class="depth" x="80" y="2" width="286" height="36"/><text class="label" x="223" y="20">318</text>
    <rect class="kerf" x="366" y="2" width="3" height="36"/>
    <rect class="depth" x="369" y="2" width="286" height="36"/><text class="label" x="512" y="20">318</text>
    <rect class="kerf" x="655" y="2" width="3" height="36"/>
    <rect class="depth" x="658" y="2" width="286" height="36"/><text class="label" x="801" y="20">318</text>
    <rect class="kerf" x="944" y="2" width="3" height="36"/>
    <rect class="offcut" x="947" y="2" width="33" height="36"/>
  </g>

  <g transform="translate(0 212)">
    <text class="bar-label" x="68" y="20">Bar 4</text>
    <rect class="bar" x="80" y="2" width="900" height="36" rx="3"/>
    <rect class="depth" x="80" y="2" width="286" height="36"/><text class="label" x="223" y="20">318</text>
    <rect class="kerf" x="366" y="2" width="3" height="36"/>
    <rect class="crossbar" x="369" y="2" width="275" height="36"/><text class="label" x="506" y="20">306</text>
    <rect class="kerf" x="644" y="2" width="3" height="36"/>
    <rect class="crossbar" x="647" y="2" width="275" height="36"/><text class="label" x="784" y="20">306</text>
    <rect class="kerf" x="922" y="2" width="3" height="36"/>
    <rect class="offcut" x="925" y="2" width="55" height="36"/>
  </g>

  <g transform="translate(0 270)">
    <text class="bar-label" x="68" y="20">Bar 5</text>
    <rect class="bar" x="80" y="2" width="900" height="36" rx="3"/>
    <rect class="width" x="80" y="2" width="275" height="36"/><text class="label" x="217" y="20">306</text>
    <rect class="kerf" x="355" y="2" width="3" height="36"/>
    <rect class="width" x="358" y="2" width="275" height="36"/><text class="label" x="495" y="20">306</text>
    <rect class="kerf" x="633" y="2" width="3" height="36"/>
    <rect class="width" x="636" y="2" width="275" height="36"/><text class="label" x="773" y="20">306</text>
    <rect class="kerf" x="911" y="2" width="3" height="36"/>
    <rect class="offcut" x="914" y="2" width="66" height="36"/><text class="label dark-label" x="947" y="20">72.4</text>
  </g>

  <g transform="translate(0 328)">
    <text class="bar-label" x="68" y="20">Bar 6</text>
    <rect class="bar" x="80" y="2" width="900" height="36" rx="3"/>
    <rect class="width" x="80" y="2" width="275" height="36"/><text class="label" x="217" y="20">306</text>
    <rect class="kerf" x="355" y="2" width="3" height="36"/>
    <rect class="upright" x="358" y="2" width="148" height="36"/><text class="label dark-label" x="432" y="20">164</text>
    <rect class="kerf" x="506" y="2" width="3" height="36"/>
    <rect class="upright" x="509" y="2" width="148" height="36"/><text class="label dark-label" x="583" y="20">164</text>
    <rect class="kerf" x="657" y="2" width="3" height="36"/>
    <rect class="offcut" x="660" y="2" width="320" height="36"/><text class="label dark-label" x="820" y="20">356.4 retained</text>
  </g>

  <g transform="translate(80 410)">
    <rect class="vertical" x="0" y="0" width="18" height="18"/><text class="legend" x="26" y="9">vertical post</text>
    <rect class="depth" x="155" y="0" width="18" height="18"/><text class="legend" x="181" y="9">depth rail</text>
    <rect class="width" x="290" y="0" width="18" height="18"/><text class="legend" x="316" y="9">width rail</text>
    <rect class="upright" x="425" y="0" width="18" height="18"/><text class="legend" x="451" y="9">gantry half</text>
    <rect class="crossbar" x="585" y="0" width="18" height="18"/><text class="legend" x="611" y="9">crossbar</text>
    <rect class="offcut" x="725" y="0" width="18" height="18"/><text class="legend" x="751" y="9">retained offcut</text>
  </g>
</svg>
