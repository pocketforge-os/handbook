<!-- PocketForge favicon — self-contained dark forge tile with ember glow, so it
     reads in a browser tab on both light and dark backgrounds down to 16px.
     Interior is the minimal anvil + hero ember (hammer omitted — lost at 16px). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="PocketForge">
  <defs>
    <linearGradient id="e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2d0"/><stop offset="45%" stop-color="#ffb142"/><stop offset="100%" stop-color="#ff5a1a"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff5a1a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hex"><polygon points="24,2.4 42.7,13.2 42.7,34.8 24,45.6 5.3,34.8 5.3,13.2"/></clipPath>
  </defs>
  <polygon points="24,2.4 42.7,13.2 42.7,34.8 24,45.6 5.3,34.8 5.3,13.2" fill="#10141c"/>
  <g clip-path="url(#hex)"><circle cx="24" cy="25" r="20" fill="url(#g)"/></g>
  <polygon points="24,2.4 42.7,13.2 42.7,34.8 24,45.6 5.3,34.8 5.3,13.2" fill="none" stroke="#546884" stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="#eef2f8">
    <rect x="13.5" y="31.3" width="21" height="4.4" rx="1.3"/>
    <rect x="20" y="27.2" width="8" height="4.3"/>
    <rect x="15.4" y="22.2" width="17.2" height="5" rx="1.3"/>
    <polygon points="15.4,22.5 9.2,24.7 15.4,26.9"/>
  </g>
  <g fill="url(#e)">
    <circle cx="24" cy="18.1" r="3.8"/><circle cx="16.4" cy="16.2" r="1.3"/>
    <circle cx="31.2" cy="16.5" r="1.4"/><circle cx="20" cy="13.1" r="1"/><circle cx="28" cy="13.4" r="1.1"/>
  </g>
</svg>
