# PocketForge Handbook — build & deploy (infra-261 Phase A, D5/D6).
#
# - On every PR: run `mkdocs build --strict` as a gate (broken nav/link fails).
# - On push to main: build, then deploy to GitHub Pages via the Actions flow.
#
# The build job needs no Pages permissions and never calls the Pages API, so the
# PR gate stays green even before Pages is enabled in repo settings. Only the
# push-to-main deploy job touches Pages (configure-pages + deploy-pages).

name: docs-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # manual re-publish (re-deploy Pages without a dummy commit)

# Least privilege by default; the deploy job elevates what it needs.
permissions:
  contents: read

# Serialize deploys; never cancel an in-progress publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned docs toolchain
        run: pip install -r requirements.txt
      - name: Install pinned CAD rendering toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad xvfb
      - name: Regenerate pinned test-node chassis assets
        run: scripts/sync-test-node-chassis-assets.sh
      - name: Build (strict — fails on any broken link or nav warning)
        run: mkdocs build --strict
      - name: Verify chassis pages, downloads, and interactive model
        run: python3 scripts/verify-built-site.py site
      # NB: we inline the tar + upload rather than use actions/upload-pages-artifact,
      # because that composite internally calls actions/upload-artifact@v4 by TAG,
      # which the org's sha_pinning_required policy rejects (a nested ref we can't pin).
      # This reproduces exactly what upload-pages-artifact does: tar the site dir to
      # $RUNNER_TEMP/artifact.tar and upload it as an artifact named "github-pages",
      # which actions/deploy-pages consumes.
      - name: Archive site as the Pages artifact tarball
        run: |
          tar --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
      - name: Upload Pages artifact (github-pages)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy (GitHub Pages)
    # Publish only from main pushes — never from a PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
