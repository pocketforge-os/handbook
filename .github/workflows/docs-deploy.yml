# PocketForge Handbook — build & deploy (infra-261 Phase A, D5/D6).
#
# - On every PR: run `mkdocs build --strict` as a gate (broken nav/link fails).
# - On push to main: build, then deploy to GitHub Pages via the Actions flow.
#
# The build job needs no Pages permissions and never calls the Pages API, so the
# PR gate stays green even before Pages is enabled in repo settings. Only the
# push-to-main deploy job touches Pages (configure-pages + deploy-pages).

name: docs-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # manual re-publish (re-deploy Pages without a dummy commit)

# Least privilege by default; the deploy job elevates what it needs.
permissions:
  contents: read

# Serialize deploys; never cancel an in-progress publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned docs toolchain
        run: pip install -r requirements.txt
      - name: Build (strict — fails on any broken link or nav warning)
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: deploy (GitHub Pages)
    # Publish only from main pushes — never from a PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
