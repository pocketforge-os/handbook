name: Normalize CAD dependency PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  normalize:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify the exact CAD-only update and normalize its PR body
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          changed_files=$(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )
          [[ "${changed_files}" == "cad/test-node-hw" ]] || {
            echo "Refusing to normalize a non-CAD-only Dependabot PR:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          }

          pinned_sha=$(
            gh api \
              "repos/${REPOSITORY}/contents/cad/test-node-hw?ref=${HEAD_SHA}" \
              --jq '.sha'
          )
          upstream_sha=$(
            gh api "repos/pocketforge-os/test-node-hw/commits/main" --jq '.sha'
          )
          [[ "${pinned_sha}" == "${upstream_sha}" ]] || {
            echo "CAD gitlink is not the current test-node-hw main commit" >&2
            echo "pinned=${pinned_sha} upstream=${upstream_sha}" >&2
            exit 1
          }

          source_pr=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/pocketforge-os/test-node-hw/commits/${pinned_sha}/pulls" \
              --jq 'map(select(.base.ref == "main")) | .[0].html_url // ""'
          )
          if [[ -z "${source_pr}" ]]; then
            source_pr="None (source commit ${pinned_sha})"
          fi

          body=$(
            printf '%s\n\n' '## Summary'
            printf '%s\n\n' \
              "Automated CAD dependency refresh: advance the exact test-node-hw gitlink to \`${pinned_sha}\` so the strict handbook build regenerates every CAD-derived asset."
            printf '%s\n\n' '## Test plan'
            printf '%s\n\n' \
              "- [x] Trusted automation verified the only changed path is \`cad/test-node-hw\` and its gitlink equals the current \`pocketforge-os/test-node-hw\` \`main\` commit."
            printf '%s\n\n' '## Related PRs'
            printf '%s\n' "${source_pr}"
          )
          jq -n --arg body "${body}" '{body: $body}' |
            gh api --method PATCH \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --input -
