version: 2

updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "cron"
      # Event-driven source-main automation opens the normal refresh PR.
      # This daily scan is only a reconciliation fallback for a missed event.
      cronjob: "17 3 * * *"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "docs"
